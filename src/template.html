<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHG Inventory Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f4f3ef; --surface:#fcfcfb; --surface2:#f3f2ee; --hover:#efeee9;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#706e68;
  --line:#e3e1db; --grid:#ebeae5; --axis:#cdcbc4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --accent:#2a78d6; --accent-ink:#fff; --accent-soft:#e8f1fc;
  --err:#b42828; --err-bg:#fdecec; --warn:#7a5200; --warn-bg:#fff3d1; --ok:#0a6b3b; --ok-bg:#e3f5ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#121211; --surface:#1a1a19; --surface2:#222221; --hover:#262624;
    --ink:#f0efec; --ink2:#c3c2b7; --muted:#9a998f;
    --line:#2f2f2c; --grid:#2a2a28; --axis:#46453f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --accent:#3987e5; --accent-ink:#0b0b0b; --accent-soft:#1b2a3d;
    --err:#ff8584; --err-bg:#3a1f1f; --warn:#f0b84a; --warn-bg:#3a2e12; --ok:#5fd29a; --ok-bg:#16301f;
  }
}
:root[data-theme="dark"]{
  --page:#121211; --surface:#1a1a19; --surface2:#222221; --hover:#262624;
  --ink:#f0efec; --ink2:#c3c2b7; --muted:#9a998f;
  --line:#2f2f2c; --grid:#2a2a28; --axis:#46453f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --accent:#3987e5; --accent-ink:#0b0b0b; --accent-soft:#1b2a3d;
  --err:#ff8584; --err-bg:#3a1f1f; --warn:#f0b84a; --warn-bg:#3a2e12; --ok:#5fd29a; --ok-bg:#16301f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar .in{max-width:1120px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--s1),var(--s3));display:inline-block}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{text-decoration:none;color:var(--ink2);font-weight:500;padding:17px 12px 15px;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs a .sw{width:8px;height:8px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 72px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:13.5px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.lg{padding:11px 18px;font-size:14.5px;border-radius:10px}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;position:relative}
.ct{position:absolute;top:12px;right:14px;display:flex;gap:6px;align-items:center}
.ct .btn{padding:4px 9px;font-size:12px}
.ct .lb{font-size:11.5px;color:var(--muted);margin-right:2px}
.cl{display:flex;flex-direction:column;margin-top:8px}
.cl .ci{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.cl .ci .k{color:var(--muted);font-size:12px;margin-right:8px}
.cl .ci .ct{position:static}
.card + .card,.mt{margin-top:14px}
h1.pg{font-size:22px;letter-spacing:-.02em;margin:0;font-weight:600}
.card h2{font-size:15px;font-weight:600;margin:0 0 2px;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--ink2)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--ink2);font-weight:500;font-size:12.5px;border-radius:7px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:500}
.hero .lbl{color:var(--ink2);font-size:13px;font-weight:500}
.hero .num{font-size:64px;line-height:1.05;font-weight:600;letter-spacing:-.035em;margin-top:4px}
.hero .unit{font-size:17px;color:var(--ink2);font-weight:500;margin-left:8px;letter-spacing:0}
.hero .meta{color:var(--muted);font-size:13px;margin-top:4px}
.hbar{display:flex;gap:2px;height:44px;border-radius:10px;overflow:hidden;margin:22px 0 0;background:var(--surface)}
.hbar.sm{height:28px;border-radius:8px;margin-top:12px}
.hbar .seg2{height:100%;display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:600;cursor:pointer;min-width:3px;transition:filter .12s;white-space:nowrap;overflow:visible}
.hbar .seg2{text-decoration:none}
.g2>.card{margin-top:0}
.hbar .seg2:hover{filter:brightness(1.08) saturate(1.05)}
.scopes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:760px){.scopes{grid-template-columns:1fr}}
.scard{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .12s,background .12s}
.scard:hover{border-color:var(--axis);background:var(--hover)}
.scard .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.scard .d{color:var(--muted);font-size:12.5px;margin-top:1px}
.scard .v{font-size:30px;font-weight:600;letter-spacing:-.025em;margin-top:10px}
.scard .v small{font-size:13px;color:var(--ink2);font-weight:500;margin-left:5px;letter-spacing:0}
.scard .f{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px;margin-top:4px}
.scard .go{color:var(--accent);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.rank{margin-top:14px}
.rank a,.rank .row{display:grid;grid-template-columns:minmax(150px,240px) 1fr 84px 56px 18px;gap:12px;align-items:center;padding:9px 8px;border-radius:9px;text-decoration:none;border-top:1px solid var(--grid)}
.rank a:first-child,.rank .row:first-child{border-top:0}
.rank a:hover{background:var(--hover)}
.rank .nm{display:flex;align-items:center;gap:9px;font-weight:500;font-size:13.5px;min-width:0}
.rank .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .trk{height:8px;border-radius:0 4px 4px 0;min-width:2px}
.rank .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.rank .p{text-align:right;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.rank .chev{color:var(--muted);text-align:right}
@media (max-width:600px){.rank a,.rank .row{grid-template-columns:1fr auto 14px}.rank .tb,.rank .p{display:none}}
@media (max-width:640px){.bar .in{gap:0 12px;padding-top:6px}.brand{flex:1;min-height:40px}nav.tabs{order:3;flex-basis:100%;margin:0 -16px;padding:0 6px}nav.tabs a{padding:10px 10px 11px}.hero .num{font-size:52px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.g2{grid-template-columns:1fr}}
.chartbox{overflow-x:auto;position:relative}
svg text{font-family:inherit;fill:var(--ink2);font-size:11px}
svg .gl{stroke:var(--grid);stroke-width:1}
svg .ax{stroke:var(--axis);stroke-width:1}
svg .hit{fill:transparent;cursor:crosshair}
svg .band{fill:var(--hover);opacity:0}
svg g.col:hover .band{opacity:1}
svg .vlbl{fill:var(--ink);font-weight:600}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:9px 11px;font-size:12.5px;min-width:160px;max-width:300px;display:none}
.tip b{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:16px;margin-top:3px}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.tip .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:5px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;color:var(--ink2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.x td{color:var(--muted)}
table.t tr.tot td{font-weight:600;border-top:1px solid var(--axis);border-bottom:0}
.scroll{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:13.5px}
.notice.err{background:var(--err-bg);color:var(--err)}
.notice.info{background:var(--accent-soft);color:var(--ink)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice .btn{background:var(--surface)}
.kv{display:flex;gap:28px;flex-wrap:wrap;margin-top:14px}
.kv div{font-size:12.5px;color:var(--muted)}
.kv b{display:block;font-size:20px;color:var(--ink);font-weight:600;letter-spacing:-.01em}
/* onboarding */
.onb{max-width:820px;margin:28px auto 0}
.onb h1{font-size:32px;letter-spacing:-.03em;margin:0 0 8px;font-weight:600;line-height:1.15}
.onb .lead{color:var(--ink2);font-size:15.5px;margin:0 0 28px;max-width:620px}
.step{display:grid;grid-template-columns:36px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:12px}
.step .no{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:600}
.step h3{margin:4px 0 4px;font-size:16px;font-weight:600}
.step p{margin:0 0 14px;color:var(--ink2);font-size:13.5px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop{border:1.5px dashed var(--axis);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);cursor:pointer;transition:background .12s,border-color .12s}
.drop:hover,.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop b{color:var(--ink)}
.hint{color:var(--muted);font-size:12.5px}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.file{display:none}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{max-width:1120px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* export + report */
.flds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
@media (max-width:760px){.flds{grid-template-columns:1fr}}
.fld{display:block}.fld span{display:block;font-size:12.5px;color:var(--ink2);font-weight:500;margin-bottom:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font-size:13.5px;resize:vertical}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.g3{grid-template-columns:1fr}}
.g3>.card{margin-top:0;display:flex;flex-direction:column;align-items:flex-start}.g3 .sub{flex:1}
.report{max-width:860px;margin:0 auto}
.rp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:14px}
.rp h2{font-size:18px;margin:0 0 2px;font-weight:600}.rp h3{font-size:14px;margin:16px 0 6px}
.rp.cover h1{font-size:30px;letter-spacing:-.03em;margin:4px 0 14px;font-weight:600;line-height:1.15}
.rp .eyebrow{color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.rp .big .num{font-size:60px;font-weight:600;letter-spacing:-.035em;line-height:1}.rp .big .unit{font-size:17px;color:var(--ink2);margin-left:8px}
.rp .meta,.rp .foot{color:var(--muted);font-size:13px;margin-top:6px}.rp .foot{margin-top:18px}
.rp .notes{margin-top:12px;font-size:13px;color:var(--ink2);border-left:3px solid var(--axis);padding-left:12px}
.rp table.t{margin-top:14px}.rp .rank{margin-top:8px}
ul.meth{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13px}ul.meth li{margin-bottom:5px}
.rp .scard{pointer-events:none}
@media print{
  :root,:root[data-theme="dark"]{--page:#fff;--surface:#fff;--surface2:#fff;--hover:#f3f2ee;--ink:#0b0b0b;--ink2:#444;--muted:#666;--line:#ddd;--grid:#e8e8e8;--axis:#bbb;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948}
  body{background:#fff;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,footer,.noprint,.tip,.ct{display:none!important}
  .wrap{padding:0;max-width:none}
  .rp{border:0;border-radius:0;padding:0;margin:0 0 22px;break-inside:avoid-page;page-break-inside:avoid}
  .rp.cover{break-after:page;page-break-after:always}
  .report{max-width:none}
  .scroll{max-height:none;overflow:visible;border:0}
  .chartbox{overflow:visible}
  @page{margin:16mm}
}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <div class="brand"><i></i>GHG Inventory</div>
  <nav class="tabs" id="tabs"></nav>
  <button class="btn sm ghost" id="themeBtn" aria-label="Toggle light or dark theme">Theme</button>
</div></header>
<main class="wrap" id="main"></main>
<footer><span>Calculations run in your browser. Uploaded data is kept on this device only.</span><span>Open-source · emission factors pending source verification</span></footer>
<div class="tip" id="tip" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>

</body>
</html>
